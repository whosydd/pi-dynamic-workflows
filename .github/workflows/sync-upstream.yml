name: Sync Upstream

on:
  schedule:
    # Every hour, check for upstream changes
    - cron: "0 * * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/QuintinShaw/pi-dynamic-workflows.git
          git fetch upstream main

          # Check if there are new commits
          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          LOCAL_HEAD=$(git rev-parse main)

          if [ "$UPSTREAM_HEAD" = "$LOCAL_HEAD" ]; then
            echo "Already up to date, skipping"
            exit 0
          fi

          echo "Upstream has new commits, syncing..."

          # Try to merge upstream/main into main
          git checkout main
          if git merge upstream/main --no-edit; then
            git push origin main
            echo "Synced successfully (fast-forward or clean merge)"
          else
            # Merge conflict — create a PR for manual resolution
            echo "Merge conflict detected, creating PR..."
            git merge --abort
            BRANCH="sync/upstream-$(date +%Y%m%d-%H%M)"
            git checkout -b "$BRANCH"
            git merge upstream/main --no-edit || true
            git push origin "$BRANCH"

            gh pr create \
              --title "sync: upstream $(date +%Y-%m-%d)" \
              --body "Upstream has changes that conflict with local modifications. Please resolve manually." \
              --base main \
              --head "$BRANCH" \
              --label "sync" || true
          fi
